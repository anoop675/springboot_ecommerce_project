<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">

    <title>E-Commerce Shop</title>
	<!--<link rel="stylesheet" th:href=@{/checkout.css}>-->
	<style>
		#or {
			position: relative;
			width: 300px;
			height: 50px;
			line-height: 50px;
			text-align: center;
		}

		#or::before,
		#or::after {
			position: absolute;
			width: 130px;
			height: 1px;
			top: 24px;
			background-color: #aaa;
			content: '';
		}
		#or::before {
			left: 0;
		}
		.navbar-blue {
			background-color: #007bff;
		}
		.navbar-blue .navbar-brand, .navbar-blue .nav-link {
			color: #ffffff;
		}
		.fixed-width-container {
			width: 1200px;
			margin-top: 30px;
		}
		.navbar .dropdown-menu {
			right: -10px;
			left: auto; 
			max-width: 200px; 
			width: auto; 
		}		
		.alert {
		    display: none; /* Initially hide the alert */
		    margin-top: -70px; /* Add some space from the top */
		    position: absolute; /* Make it absolute to place it top-right of the table */
		    right: 0; /* Align to the right */
		}
	</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-blue fixed-top">
	  <div class="container-fluid">
	      <a class="navbar-brand" href="#">
	         <h3 class="d-inline-block align-top">E-commerce Shop</h3>
	      </a>
	      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
	         <span class="navbar-toggler-icon"></span>
	      </button>
	   <div class="collapse navbar-collapse" id="navbarSupportedContent">
	       <ul class="navbar-nav mr-auto"></ul>
	         <ul class="navbar-nav ml-auto">
	           <li class="nav-item dropdown">
	            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
	                 Menu
	            </a>
	            <div class="dropdown-menu" aria-labelledby="navbarDropdown">
					<a class="dropdown-item" th:href="@{/VITproject/shop}" href="#">Home</a>
					<!--<a class="dropdown-item" sec:authorize="isAnonymous()" th:href="@{/VITproject/login}" href="#">login</a>-->
					<a class="dropdown-item" sec:authorize="isAuthenticated()" th:href="@{/VITproject/logout}" href="#">Logout</a>
					<a class="dropdown-item" th:href="@{/VITproject/cart}" href="#">
						Cart (<span th:text="${cartCount}"><!----></span>)
					</a>
	            </div>
	         </li>
	      </ul>
	   </div>
	</div>
</nav>

<div class="container" style="padding-top: 70px;">
	<div class="alert alert-danger" id="responseAlert" role="alert" th:if="${error}" th:text="${error}"></div>
    <section class="mt-5 mb-4">
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card wish-list pb-1">
                    <div class="card-body">
                        <h5 class="mb-2">Billing details</h5>
						<form action="" method="post" th:action="@{/VITproject/eth-payment}" th:object="${deliveryAddressDto}">
                        <div class="row">
                            <div class="col-lg-6">
                                <div class="md-form md-outline mb-0 mb-lg-4">
                                    <label for="firstName">First name</label>
                                    <input type="text" id="firstName"  name="firstName" th:field="*{firstName}" required class="form-control mb-0 mb-lg-2">
                                </div>
                            </div>
                            <div class="col-lg-6">
                                <div class="md-form md-outline">
                                    <label for="lastName">Last name</label>
									<input type="text" id="lastName"  name="lastName" th:field="*{lastName}" required class="form-control mb-0 mb-lg-2">
                                </div>
                            </div>
                        </div>
						<!-- Country -->
                        <div class="d-flex flex-wrap">
                            <div class="select-outline position-relative w-100">
                                <label>Country - <strong>INDIA</strong></label>
                            </div>
                        </div>
						<!-- Address Part 1 -->
                        <div class="md-form md-outline mt-2">
                            <label for="addressLine1">Address (Line 1)</label>
							<input type="text" id="addressLine1"  name="addressLine1" th:field="*{addressLine1}" required placeholder="House number and street name" class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Address Part 2 -->
                        <div class="md-form md-outline mt-2">
                            <label for="addressLine2">Address (Line 2)</label>
							<input type="text" id="addressLine2"  name="addressLine2" th:field="*{addressLine2}" placeholder="Apartment, suite, unit etc." class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Postcode / ZIP -->
                        <div class="md-form md-outline mt-3">
                            <label for="postalCode">Postcode / ZIP</label>
							<input type="text" maxlength="6" minlength="6" id="postalCode"  name="postalCode" th:field="*{postalCode}" required class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Town / City -->
                        <div class="md-form md-outline mt-2">
                            <label for="townCity">Town / City</label>
							<input type="text" id="townCity"  name="townCity" th:field="*{townCity}" required class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Phone -->
                        <div class="md-form md-outline mt-2">
                            <label for="phoneNumber">Phone</label>
                            <input type="number" minlength="10" maxlength="10" required id="phoneNumber" name="phoneNumber" th:field="*{phoneNumber}" class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Email address -->
                        <div class="md-form md-outline mt-2">
                            <label for="email">Email address</label>
							<input type="email" required id="email" name="email" th:field="*{email}" class="form-control mb-0 mb-lg-2">
                        </div>

                        <!-- Additional information
                        <div class="md-form md-outline mt-2">
                            <label for="form76">Additional information</label>
                            <textarea id="form76" class="md-textarea form-control" rows="4"></textarea>
                        </div>-->
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body">
						<ul class="list-group list-group-flush">
							<li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 pb-0">
							    Amount Payable
							    <span th:text="${ethAmount} + ' ETH'"></span>
							</li>
						    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
						          Shipping
						          <span >0.000000 ETH</span>
						    </li>
							<li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 mb-3">
							    <div>
							        <strong>Total Amount</strong>
							        <!--<strong>
							            <p class="mb-0">(including VAT)</p>
							        </strong>-->
							    </div>
							    <!--<span><strong>₹<span th:text="${total}"></span></strong></span>-->
								<span><strong><span th:text="${ethAmount}"></span> ETH</strong></span>
							</li>
							<p>1 ETH =
								<span><strong>₹<span th:text="${eth_inr_rate}" style="color: green;"></span></strong></span>
							</p>
						 </ul>
						 <input type="hidden" name="ethAmount" th:value="${ethAmount}">
						 <button type="submit" class="btn btn-primary btn-block waves-effect waves-light" onclick="handleClick()">Pay Now (in ETH)</button>
					 	</form>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">

                        <a class="dark-grey-text d-flex justify-content-between" data-toggle="collapse" href="#collapseExample"
                           aria-expanded="false" aria-controls="collapseExample">
                            Add a discount code (optional)
                            <span><i class="fas fa-chevron-down pt-1"></i></span>
                        </a>

                        <div class="collapse" id="collapseExample">
                            <div class="mt-3">
                                <div class="md-form md-outline mb-0">
                                    <input type="text" id="discount-code" class="form-control font-weight-light"
                                           placeholder="Enter discount code">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Modal Structure -->
<div id="ethPaymentModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="ethPaymentModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
			Processing Payment Request
            </div>
            <div class="modal-body">
                Redirecting you to payments. Please wait...
            </div>
            <div class="modal-footer">
            </div>
        </div> 
    </div>
</div>



<!-- Bootstrap, jQuery, and Web3 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/js/bootstrap-select.min.js"></script>
<script src="https://code.jquery.com/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

<!-- Add ethers.js to parse ETH to Wei -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.1/dist/ethers.min.js"></script>
<script>
    function handleClick() {
		$('#ethPaymentModal').modal('show');
        
		setTimeout(() => {
	        // Submit the form after your logic
	        document.querySelector('form').submit();
		}, 1000);
    }
</script>
<script>
    $(document).ready(function () {
        var error = [[${error}]]; // Correctly pass error from the model
        if (error) {
            var alertBox = $('#responseAlert');
            alertBox.text(error);  // Show the error message in the alert
            alertBox.show();
            setTimeout(function () {
                alertBox.hide();
            }, 3000);  // Hide the alert after 3 seconds
        }
    });
</script>
</body>
</html>
