<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">

    <title>E-commerce Shop</title>
	<style>
		.navbar-blue {
		   background-color: #007bff;
		}
		.navbar-blue .navbar-brand, .navbar-blue .nav-link {
		   color: #ffffff;
		}
		.navbar .dropdown-menu {
		    right: -10px;
		    left: auto;
		    max-width: 200px;
		    width: auto;
		}		
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-blue fixed-top">
	    <div class="container-fluid">
	        <a class="navbar-brand" href="#">
	            <h3 class="d-inline-block align-top">E-commerce Shop</h3>
	        </a>
	        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
	            <span class="navbar-toggler-icon"></span>
	        </button>

	        <div class="collapse navbar-collapse" id="navbarSupportedContent">
	            <ul class="navbar-nav mr-auto"></ul>
	            <ul class="navbar-nav ml-auto">
	                <li class="nav-item dropdown">
	                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
	                        Menu
	                    </a>
	                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
							<a class="dropdown-item" th:href="@{/VITproject/shop}" href="#">Home</a>
							<a class="dropdown-item" sec:authorize="isAuthenticated()" th:href="@{/VITproject/logout}" href="#">Logout</a>
							<a class="dropdown-item" th:href="@{/VITproject/cart}" href="#">
							    Cart (<span th:text="${cartCount}">0</span>)
							</a>
	                    </div>
	                </li>
	            </ul>
	        </div>
	    </div>
	</nav>

<main>
    <div class="container" style="padding-top: 70px">

        <!--Section: Block Content-->
        <section class="mt-5 mb-4">

            <!--Grid row-->
            <div class="row">

                <!--Grid column-->
                <div class="col-lg-8">

                    <!-- Card -->
                    <div class="card wish-list mb-4">
                        <div class="card-body">

                            <h4 class="mb-4" style="color: green;">Hooray! Your orders are confirmed</h4>
							
							<div class="row mb-4" th:each="cartProduct, iStat : ${cart}">
							    <div class="col-md-5 col-lg-3 col-xl-3">
							        <div class="mb-3 mb-md-0">
							            <img class="img-fluid w-100"
							                 th:src="@{${'/productImages/' + cartProduct.product.imageName}}"
							                 alt="Product Image">
							        </div>
							    </div>
							    <div class="col-md-7 col-lg-9 col-xl-9">
							        <div>
							            <div class="d-flex justify-content-between">
							                <div>
							                    <h5 th:text="${cartProduct.product.name}"></h5>
							                    <p class="mb-3 text-uppercase small">Weight: <span th:text="${cartProduct.product.weight}"></span> grams</p>
							                    <p class="mb-3 text-uppercase small">Quantity: <span th:text="${cartProduct.quantity}"></span></p>
							                </div>
							            </div>
							        </div>
							    </div>
							</div>
                            <hr class="mb-4">

                            <p class="text-primary mb-0"><i class="fas fa-info-circle mr-1"></i> Please wait for the update if the order confirmation is delayed.</p>
                        </div>
                    </div>
                </div>
				<!--Grid column-->
				<div class="col-lg-4">
				    <!-- Card -->
				    <div class="card mb-4">
				        <div class="card-body">

				            <h5 class="mb-3">Total Amount </h5>

				            <ul class="list-group list-group-flush">
								<li class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 mb-3">
								    <div>
								        <strong>Total amount</strong>
								    </div>
								    <span><strong><span th:text="${total}"></span> ETH</strong></span>
								</li>
								<li class="list-group-item border-0 px-0">
								    <p style="color: green; margin: 0;"><strong>Payment Status: Paid</strong></p>
								</li>
								<li class="list-group-item border-0 px-0">
								    <div class="d-flex w-100 align-items-center">
								        <strong class="mr-2">Transaction Hash:</strong>
								        <input type="text" id="txnHashBox" class="form-control" 
								               style="font-size: 0.9rem;" th:value="${txnHash}" readonly>
								    </div>
								    <div class="d-flex flex-column align-items-end ml-3">
								        <button class="btn btn-outline-primary btn-sm mb-2" onclick="copyTxnHash()">Copy</button>
								    </div>
								</li>
								<li class="list-group-item border-0 px-0">
								    <button class="btn btn-outline-success btn-sm" onclick="openEtherscan()">View on Etherscan</button>
								</li>
				            </ul>
				        </div>
				    </div>
            </div>
        </section>
    </div>
</main>

<!-- Bootstrap-Select JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/js/bootstrap-select.min.js"></script>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldjDDvf6ntkA6B1QYZZjRFpurt9TtB6UJm1wDXg" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-3qaqj0lcgkHh7uWfhA5MXvLIbK39YzuFHz53CLxZCrq3GmC5iT9u0NQBeinVGAaI" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/js/bootstrap-select.min.js"></script>
<script src="https://code.jquery.com/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<!--JS to copy the transactionHash-->
<script>
    function copyTxnHash() {
        const txnHashBox = document.getElementById("txnHashBox");
        txnHashBox.select();
        txnHashBox.setSelectionRange(0, 99999); // For mobile devices
        navigator.clipboard.writeText(txnHashBox.value).then(() => {
            alert("Transaction Hash copied to clipboard!");
        }).catch(err => {
            console.error("Error copying Transaction Hash: ", err);
        });
    }

	function openEtherscan() {
	    const txnHash = document.getElementById("txnHashBox").value;
	    if (txnHash) {
	        const url = `https://sepolia.etherscan.io/tx/${txnHash}`;
	        window.open(url, '_blank');
	    } else {
	        alert("Transaction Hash is empty!");
	    }
	}
	
</script>

</body>
</html>
