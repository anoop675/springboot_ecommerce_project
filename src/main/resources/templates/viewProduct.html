<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css"
          integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>E-Commerce Shop</title>
	<style>
	        .navbar-blue {
	            background-color: #007bff;
	        }
	        .navbar-blue .navbar-brand, .navbar-blue .nav-link {
	            color: #ffffff;
	        }
			.fixed-width-container {
			    width: 1200px;
			    margin-top: 30px;
			}
			.product-details-list {
			    /*list-style-type: none;  Removes default bullet points */
			    padding: 0; /* Removes padding from the list */
			    margin: 10px; /* Removes margin from the list */
			}

			.product-details-list li {
			    margin-bottom: 5px; /* Adjusts space between items */
			}
			.image {
			    border-radius: 10px;
			    box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.5); /* Stronger shadow */
			    filter: brightness(100%);  /*Makes the image more blunt */
			    transition: transform 0.3s, filter 0.0s;
				margin-top: 60px;
			}
			.image:hover {
			    transform: scale(1.05); 
			    filter: brightness(100%);
			}
			.price {
			    font-weight: bold;
			}
			/* Custom CSS for positioning and sizing the dropdown menu */
			.navbar .dropdown-menu {
			    right: -10px; /* Adjust this value to add spacing from the right */
			    left: auto; /* Prevent auto left positioning */
			    max-width: 200px; /* Adjust this value to control the width */
			    width: auto; /* Ensure the width adjusts to max-width */
			}
			.custom-spacing .btn + .btn {
			    margin-left: 1rem; /* Adjust the value as needed */
			}
			/* General styles for the star rating container */
			.star-rating {
			  display: flex;
			  align-items: center;
			  justify-content: center;
			}

			/* Basic star styles */
			.star {
			  font-size: 4rem; /* default size */
			  color: #ccc; /* gray color for unselected stars */
			  cursor: pointer;
			  transition: color 0.2s, font-size 0.2s;
			}

			/* Style for selected stars to make them gold */
			.star.selected {
			  color: #FFD700; /* gold color for selected stars */
			}
	</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-blue">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <h3 class="d-inline-block align-top">E-commerce Shop</h3>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto"></ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Menu
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" th:href="@{/VITproject/shop}" href="#">Home</a>
                        <!--<a class="dropdown-item" sec:authorize="isAnonymous()" th:href="@{/VITproject/login}" href="#">login</a>-->
                        <a class="dropdown-item" sec:authorize="isAuthenticated()" th:href="@{/VITproject/logout}" href="#">Logout</a>
                        <a class="dropdown-item" th:href="@{/VITproject/cart}" href="#">
                        	Cart (<span class="dropdown-item" th:text="${cartCount}">0</span>)
						</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <div class="row">
        <div class="col-sm-5 d-flex justify-content-center">
            <img class="image" height="300px" width="300px" src="" th:src="@{${'/productImages/' + product.imageName}}" alt="">
        </div>
        <div class="col-sm-7 mt-5">
            <h2 th:text="${product.name}"></h2>
            <p th:text="${product.category.name}"></p>
            <h2>₹ <span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}"></span></h2>
            <h5>Weight:
                <span th:text="${product.weight}"></span> grams.
            </h5>
            <p>Description: 
                <span th:text="${product.description}" style="margin-top: 20px"></span>
            </p>
			<ul class="product-details-list">
			    <li>Color: <span th:text="${product.color}"></span></li>
			    <li>Style: <span th:text="${product.style}"></span></li>
			    <li>Country of Origin: <span th:text="${product.countryOrigin}"></span></li>
			</ul>
            <div class="rating">
                <span>Rating:</span>
                <span th:each="i : ${#numbers.sequence(1, 5)}">
                    <i class="fa" th:classappend="${i <= productRating} ? 'fa-star' : 'fa-star-o'"></i>
                </span>
            </div>

            <!-- Wrap buttons in a flex container -->
            <div class="d-flex justify-content-start mt-3 custom-spacing">
                <a href="" th:href="@{/VITproject/addToCart/{id}(id=${product.id})}" class="btn btn-primary me-4">Add to cart</a>
                <button type="button" class="btn btn-secondary" data-toggle="modal" data-target="#rateProductModal">Rate this product</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Rating -->
<div class="modal fade" id="rateProductModal" tabindex="-1" aria-labelledby="rateProductModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="rateProductModalLabel">Rate Product</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Star Rating System -->
                <div id="starRating" class="star-rating">
                    <span class="star" data-value="1">&#9733;</span>
                    <span class="star" data-value="2">&#9733;</span>
                    <span class="star" data-value="3">&#9733;</span>
                    <span class="star" data-value="4">&#9733;</span>
                    <span class="star" data-value="5">&#9733;</span>
                </div>
                <input type="hidden" id="selectedRating" name="rating" value="0">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" onclick="submitRating()">Submit</button>
            </div>
        </div>
    </div>
</div>

<!-- Include JS for Rating Selection -->
<script>
    // Star click event to set selected rating
    document.querySelectorAll('#starRating .star').forEach((star, index) => {
        star.addEventListener('click', function() {
            // Set selected rating
            document.getElementById('selectedRating').value = this.getAttribute('data-value');
            
            // Remove selected class from all stars and add it up to the clicked one
            document.querySelectorAll('#starRating .star').forEach((s, i) => {
                s.classList.toggle('selected', i <= index);
            });
        });
    });

    // Submit rating function
    function submitRating() {
        const rating = document.getElementById('selectedRating').value;
        if (rating === "0") {
            alert("Please select a rating.");
            return;
        }
        // Construct URL with rating
        const productId = /* Use Thymeleaf to set the product ID here */ [[${product.id}]];
        const url = `/VITproject/rate/${productId}/${rating}`;
        window.location.href = url;
    }
</script>

<style>
    .star {
        cursor: pointer;
        color: gray;
    }
    .star.selected, .star:hover {
        color: gold;
    }
</style>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>

<!-- Bootstrap-Select JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.18/js/bootstrap-select.min.js"></script>


</body>
</html>
